services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raja_topup_games
      POSTGRES_USER: rtg
      POSTGRES_PASSWORD: rtg_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtg -d raja_topup_games"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "10000:10000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rtg:rtg_local_only@db:5432/raja_topup_games
      AUTO_CREATE_DB: "1"
      AUTO_SEED_DB: "1"
      SESSION_COOKIE_SECURE: "0"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
