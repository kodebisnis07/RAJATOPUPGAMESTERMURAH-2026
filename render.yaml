services:
  - type: web
    name: raja-topup-games
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask init-db
    startCommand: gunicorn -c gunicorn.conf.py run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: AUTO_CREATE_DB
        value: "0"
      - key: AUTO_SEED_DB
        value: "0"
      - key: SUPERADMIN_USERNAME
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: raja-topup-games-db
          property: connectionString
      - key: MEDIA_STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: rajatopupgames

databases:
  - name: raja-topup-games-db
    databaseName: raja_topup_games
    user: raja_topup_games_user
